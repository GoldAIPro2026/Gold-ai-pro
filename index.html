<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIMO GOLD AI</title>
<style>
body{background:#fff;font-family:Arial;text-align:center;padding:20px}
h1{font-size:28px}
.price{font-size:48px;font-weight:bold;color:#000;border:2px solid #d4af37;padding:20px;border-radius:15px}
.live{color:green}
</style>
</head>
<body>
<h1>SIMO GOLD AI</h1>
<p>XAUUSD • SMART TRADING ASSISTANT</p>
<div class="price">
<span class="live">● LIVE</span><br>
<span id="goldPrice">Loading...</span><br>
<span style="font-size:14px" id="time">Connecting...</span>
</div>
<p id="status">Market Analysis: WAIT</p>

<script>
async function getPrice(){
  try{
    let res = await fetch('https://data-asg.goldprice.org/dbXRates/USD');
    let data = await res.json();
    let price = data.items[0].curr;
    // GoldPrice.org gives XAU in different format, we use 1 oz
    document.getElementById('goldPrice').innerText = '$' + price;
    document.getElementById('time').innerText = 'Last update: ' + new Date().toLocaleTimeString();
    document.getElementById('status').innerText = 'Market Analysis: Price Connected - LIVE';
  }catch(e){
    document.getElementById('goldPrice').innerText = 'Check Internet';
  }
}
getPrice();
setInterval(getPrice, 60000);
</script>
</body>
</html>
